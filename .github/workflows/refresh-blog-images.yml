name: Refresh Blog Images

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * 0'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh all blog images with Pixabay
        run: node scripts/refresh-images-v2.js
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

      - name: Commit updated images
        shell: bash
        run: |
          set -e
          git config user.name "mrglowra-blog-bot"
          git config user.email "actions@users.noreply.github.com"

          # Only publish post/image changes. Ignore package-lock or node_modules changes.
          git add posts/ public/images/

          if git diff --cached --quiet; then
            echo "No post or image changes to commit."
            exit 0
          fi

          git commit -m "Refresh blog images with topic-matched Pixabay photos"
          git pull --rebase origin main
          git push origin HEAD:main
