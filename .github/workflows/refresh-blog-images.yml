name: Refresh Blog Images

on:
  workflow_dispatch:
  # Run automatically when the image-matching engine changes so the whole
  # existing library is rebuilt immediately with fresh, topic-relevant photos.
  push:
    paths:
      - 'scripts/refresh-images-v2.js'
  schedule:
    - cron: '15 5 * * 0'

permissions:
  contents: write

concurrency:
  group: mrglowra-image-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh every post with unique, topic-matched Pixabay photos
        run: node scripts/refresh-images-v2.js
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

      - name: Commit updated images
        shell: bash
        run: |
          set -e
          git config user.name "mrglowra-blog-bot"
          git config user.email "actions@users.noreply.github.com"

          git add posts/ public/images/

          if git diff --cached --quiet; then
            echo "No post or image changes to commit."
            exit 0
          fi

          git commit -m "Replace repeated blog photos with relevant Pixabay images"
          git pull --rebase origin main
          git push origin HEAD:main
