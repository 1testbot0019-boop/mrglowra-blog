name: Refresh Blog Images

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-images.js'
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * 0'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh all blog images
        run: node scripts/refresh-images.js
      - name: Commit updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Replace blog images with relevant free-source photos"
          git push
