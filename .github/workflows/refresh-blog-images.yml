name: Refresh Blog Images

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh-images-v3.js'

permissions:
  contents: write

concurrency:
  group: mrglowra-image-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Replace every post photo with title-relevant Pixabay photos
        run: node scripts/refresh-images-v3.js
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

      - name: Commit refreshed post photos
        shell: bash
        run: |
          set -e
          git config user.name "mrglowra-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/ public/images/
          if git diff --cached --quiet; then
            echo "No image changes were needed."
            exit 0
          fi
          git commit -m "Replace all blog photos with title-relevant Pixabay images"
          git pull --rebase origin main
          git push origin HEAD:main
