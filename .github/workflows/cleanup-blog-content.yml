name: Clean Blog Content

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sanitize-posts.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mrglowra-content-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove Markdown formatting from posts
        run: node scripts/sanitize-posts.js

      - name: Commit cleaned post content only
        shell: bash
        run: |
          set -e
          git config user.name "mrglowra-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "No post content changes."
            exit 0
          fi
          git commit -m "Clean blog post formatting"
          git pull --rebase origin main
          git push origin HEAD:main
