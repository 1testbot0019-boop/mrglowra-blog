name: Clean Blog Content and Images

on:
  push:
    branches: [main]
    paths-ignore:
      - 'posts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove Markdown formatting from posts
        run: node scripts/sanitize-posts.js

      - name: Replace images with topic-matched free-source images
        run: node scripts/refresh-images.js
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Commit cleanup
        run: |
          git config user.name "mrglowra-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet || git commit -m "Clean blog formatting and refresh article images"
          git push
