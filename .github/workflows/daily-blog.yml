name: Daily Mr Glowra Blog - US 4 Post Schedule

on:
  schedule:
    # GitHub cron is UTC. Runtime gate uses America/New_York so DST is handled correctly.
    # Four daily US publishing slots: 08:00, 10:00, 12:00 and 14:00 New York time.
    - cron: '0,30 12-20 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Generate four blogs immediately'
        required: false
        default: true
        type: boolean
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: mrglowra-blog-publisher
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 2000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check US publishing slot
        id: slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.force_run || 'true' }}" = "true" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "batch_size=4" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "batch_size=1" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            MESSAGE="${{ github.event.head_commit.message }}"
            if [[ "$MESSAGE" == *"[publish-now]"* ]]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "batch_size=4" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          US_HOUR=$(TZ=America/New_York date +%H)
          US_MINUTE=$(TZ=America/New_York date +%M)
          US_DATE=$(TZ=America/New_York date +%F)

          echo "US date: $US_DATE"
          echo "US time: ${US_HOUR}:${US_MINUTE}"

          # Only these four slots run on the normal schedule.
          # Cron fires every 30 minutes; the first half-hour of each slot is accepted.
          if [ "$US_MINUTE" -lt 30 ] && { [ "$US_HOUR" = "08" ] || [ "$US_HOUR" = "10" ] || [ "$US_HOUR" = "12" ] || [ "$US_HOUR" = "14" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "batch_size=1" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "batch_size=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.slot.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.slot.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.slot.outputs.should_run == 'true'
        run: npm ci --prefer-online --no-audit --no-fund

      - name: Generate US SEO blogs
        if: steps.slot.outputs.should_run == 'true'
        env:
          BLOG_BATCH_SIZE: ${{ steps.slot.outputs.batch_size }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL || 'claude-sonnet-5' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          OMNIROUTE_URL: ${{ secrets.OMNIROUTE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL || 'auto' }}
        run: npm run generate

      - name: Download title-matched unique Pixabay image
        if: steps.slot.outputs.should_run == 'true'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node scripts/refresh-images-v3.js

      - name: Run SEO audit
        if: steps.slot.outputs.should_run == 'true'
        env:
          REQUIRE_IMAGES: 'true'
        run: node scripts/seo-audit.js || true

      - name: Commit and publish blogs
        if: steps.slot.outputs.should_run == 'true'
        shell: bash
        run: |
          set -e
          git config user.name "mrglowra-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/ public/images/
          if git diff --cached --quiet; then
            echo "No new blog/image changes were generated."
            exit 1
          fi
          git diff --cached --name-only
          git commit -m "Publish US SEO blogs with unique title-matched photos"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "US blog publication completed."

      - name: Skip non-slot invocation
        if: steps.slot.outputs.should_run != 'true'
        run: echo "Outside the four New York publishing slots; nothing to publish."
