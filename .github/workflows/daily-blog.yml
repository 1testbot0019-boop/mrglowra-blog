name: Daily Mr Glowra Blog - US Schedule

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/generate-10-blogs.trigger'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of posts to generate immediately'
        required: false
        default: '1'
      force_run:
        description: 'Run immediately regardless of US posting hour'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mrglowra-us-blog-publishing
  cancel-in-progress: false

env:
  TZ: America/New_York
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 2000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000

jobs:
  us-schedule-check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      slot: ${{ steps.check.outputs.slot }}
      batch_size: ${{ steps.check.outputs.batch_size }}
    steps:
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "slot=manual" >> "$GITHUB_OUTPUT"
            echo "batch_size=${{ github.event.inputs.batch_size || '1' }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "slot=commit-blog-batch" >> "$GITHUB_OUTPUT"
            echo "batch_size=6" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          US_HOUR=$(TZ=America/New_York date +%H)
          US_DATE=$(TZ=America/New_York date +%F)
          case "$US_HOUR" in
            08|12|16|20)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "slot=$US_DATE-$US_HOUR" >> "$GITHUB_OUTPUT"
              echo "batch_size=1" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "slot=none" >> "$GITHUB_OUTPUT"
              echo "batch_size=0" >> "$GITHUB_OUTPUT"
              ;;
          esac

  generate-and-publish:
    needs: us-schedule-check
    if: needs.us-schedule-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --prefer-online --no-audit --no-fund
      - name: Ensure enough fresh US topics for this batch
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='generate.js';
          let s=fs.readFileSync(p,'utf8');
          const topics=[
            'How to Clean a Microwave Without Harsh Chemicals','How to Remove Coffee Stains From a Kitchen Countertop','How to Clean a Glass Stovetop Without Scratches','How to Clean a Dishwasher Filter and Remove Odors','How to Remove Grease From a Range Hood Filter','How to Clean Baseboards Without Damaging Painted Walls','How to Clean Window Tracks and Sliding Door Tracks','How to Remove Moldy Smells From a Bathroom Safely','How to Clean a Washing Machine and Remove Musty Odors','How to Clean Fabric Sofas Without Water Rings','How to Remove Candle Wax From Hardwood Floors Safely','How to Clean a Mattress and Reduce Everyday Odors','How to Clean Blinds Without Bending or Breaking Them','How to Remove Red Wine Stains From Carpet','How to Clean Stainless Steel Appliances Without Streaks','How to Clean a Shower Curtain and Liner','How to Remove Rust Stains From Bathroom Fixtures','How to Clean a Refrigerator Inside and Prevent Odors','How to Clean Ceiling Fans Without Spreading Dust','How to Clean an Oven Safely Without Damaging the Finish'
          ];
          const literal='const usTopics = '+JSON.stringify(topics)+';';
          s=s.replace(/const usTopics = \[[^\n]*\];/,literal);
          fs.writeFileSync(p,s);
          console.log('Expanded temporary topic pool to',topics.length,'fresh US topics.');
          NODE
      - name: Generate requested blog batch with Gemini
        run: npm run generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BLOG_BATCH_SIZE: ${{ needs.us-schedule-check.outputs.batch_size }}
      - name: Run US SEO audit (images optional)
        run: node scripts/seo-audit.js
        env:
          REQUIRE_IMAGES: 'false'
      - name: Publish only generated post files
        run: |
          git config user.name "mrglowra-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "ERROR: No new post was generated for slot ${{ needs.us-schedule-check.outputs.slot }}"
            exit 1
          fi
          generated=$(git diff --cached --name-only -- posts/ | grep -c '\.json$' || true)
          echo "Generated post files: $generated"
          git commit -m "Publish blog batch (${{ needs.us-schedule-check.outputs.slot }})"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Confirm publishing completed
        run: echo "Published requested blog batch of ${{ needs.us-schedule-check.outputs.batch_size }} post(s)."
