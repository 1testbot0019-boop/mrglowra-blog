name: Daily Mr Glowra Blog

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of US blog posts to generate'
        required: false
        default: '10'

permissions:
  contents: write

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 2000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reset npm cache and install dependencies
        run: |
          npm cache clean --force
          npm install --prefer-online --no-audit --no-fund

      - name: Refresh existing posts that still use the placeholder image
        run: node scripts/refresh-images.js
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Generate one US article
        run: npm run generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BLOG_BATCH_SIZE: ${{ github.event.inputs.batch_size || '1' }}

      - name: Run US SEO audit
        run: node scripts/seo-audit.js

      - name: Publish article to GitHub
        run: |
          git config user.name "mrglowra-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet || git commit -m "Publish daily US cleaning article and refresh images"
          git push
