name: Daily Mr Glowra Blog - US 30 Minute Schedule

on:
  schedule:
    # GitHub cron is UTC. These two windows cover both US daylight and standard time.
    # The runtime gate below accepts only 08:00 through 12:30 America/New_York.
    - cron: '0,30 12-17 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Generate one blog immediately'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: mrglowra-blog-publisher
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 2000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000

jobs:
  publish-one:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check US publishing slot
        id: slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.force_run || 'true' }}" = "true" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          US_HOUR=$(TZ=America/New_York date +%H)
          US_MINUTE=$(TZ=America/New_York date +%M)
          US_DATE=$(TZ=America/New_York date +%F)

          echo "US date: $US_DATE"
          echo "US time: ${US_HOUR}:${US_MINUTE}"

          # Accept the 10 daily publishing slots:
          # 08:00, 08:30, 09:00, 09:30, 10:00, 10:30,
          # 11:00, 11:30, 12:00, 12:30 America/New_York.
          if [ "$US_HOUR" -ge 8 ] && [ "$US_HOUR" -le 12 ]; then
            if [ "$US_HOUR" -lt 12 ] || [ "$US_MINUTE" -lt 30 ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_run=false" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.slot.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.slot.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.slot.outputs.should_run == 'true'
        run: npm ci --prefer-online --no-audit --no-fund

      - name: Generate exactly one US SEO blog
        if: steps.slot.outputs.should_run == 'true'
        env:
          BLOG_BATCH_SIZE: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL || 'claude-sonnet-5' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          OMNIROUTE_URL: ${{ secrets.OMNIROUTE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL || 'auto' }}
        run: npm run generate

      - name: Download topic-matched Pixabay images
        if: steps.slot.outputs.should_run == 'true'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node scripts/refresh-images-v2.js

      - name: Run SEO audit
        if: steps.slot.outputs.should_run == 'true'
        env:
          REQUIRE_IMAGES: 'true'
        run: node scripts/seo-audit.js || true

      - name: Commit and publish one post
        if: steps.slot.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "mrglowra-blog-bot"
          git config user.email "actions@users.noreply.github.com"

          # Only blog content and downloaded images are published.
          # package-lock.json and node_modules are never staged.
          git add posts/ public/images/

          if git diff --cached --quiet; then
            echo "No new blog/image changes were generated."
            exit 1
          fi

          echo "Files to publish:"
          git diff --cached --name-only

          git commit -m "Publish one US SEO blog with Pixabay images"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "One US blog published successfully."

      - name: Skip non-US-slot invocation
        if: steps.slot.outputs.should_run != 'true'
        run: echo "This cron invocation is outside the 10 US publishing slots; nothing to publish."