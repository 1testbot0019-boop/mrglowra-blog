name: Daily Mr Glowra Blog - US Schedule

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/generate-10-blogs.trigger'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of posts to generate immediately'
        required: false
        default: '1'
      force_run:
        description: 'Run immediately regardless of US posting hour'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mrglowra-us-blog-publishing
  cancel-in-progress: false

env:
  TZ: America/New_York
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 2000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000

jobs:
  us-schedule-check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      slot: ${{ steps.check.outputs.slot }}
      batch_size: ${{ steps.check.outputs.batch_size }}
    steps:
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "slot=manual" >> "$GITHUB_OUTPUT"
            echo "batch_size=${{ github.event.inputs.batch_size || '1' }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "slot=commit-blog-batch" >> "$GITHUB_OUTPUT"
            echo "batch_size=6" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          US_HOUR=$(TZ=America/New_York date +%H)
          US_DATE=$(TZ=America/New_York date +%F)
          case "$US_HOUR" in
            08|12|16|20)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "slot=$US_DATE-$US_HOUR" >> "$GITHUB_OUTPUT"
              echo "batch_size=1" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "slot=none" >> "$GITHUB_OUTPUT"
              echo "batch_size=0" >> "$GITHUB_OUTPUT"
              ;;
          esac

  generate-and-publish:
    needs: us-schedule-check
    if: needs.us-schedule-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --prefer-online --no-audit --no-fund
      - name: Generate requested blog batch with Gemini
        run: npm run generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BLOG_BATCH_SIZE: ${{ needs.us-schedule-check.outputs.batch_size }}
      - name: Run US SEO audit (images optional)
        run: node scripts/seo-audit.js
        env:
          REQUIRE_IMAGES: 'false'
      - name: Publish article and image updates to GitHub
        run: |
          git config user.name "mrglowra-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          # Stage everything; images/ may legitimately be absent because images are optional.
          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: No new or changed post was generated for slot ${{ needs.us-schedule-check.outputs.slot }}"
            exit 1
          fi
          git commit -m "Publish blog batch (${{ needs.us-schedule-check.outputs.slot }})"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Confirm publishing completed
        run: echo "Published ${{ needs.us-schedule-check.outputs.batch_size }} blog post(s)."
