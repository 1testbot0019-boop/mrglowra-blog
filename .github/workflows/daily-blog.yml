name: Daily Mr Glowra Blog

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate one article
        run: npm run generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini

      - name: Publish article to GitHub
        run: |
          git config user.name "mrglowra-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet || git commit -m "Publish daily Mr Glowra blog article"
          git push
