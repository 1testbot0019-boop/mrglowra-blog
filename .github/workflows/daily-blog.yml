name: Daily Mr Glowra Blog - US Schedule

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/generate-10-blogs.trigger'
      - '.github/triggers/run-six-posts-now.trigger'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of posts to generate immediately'
        required: false
        default: '10'
        type: string
      force_run:
        description: 'Run immediately regardless of US posting hour'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mrglowra-us-blog-publishing
  cancel-in-progress: false

env:
  TZ: America/New_York
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_FETCH_RETRIES: 5
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 2000
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 30000

jobs:
  us-schedule-check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      slot: ${{ steps.check.outputs.slot }}
      batch_size: ${{ steps.check.outputs.batch_size }}
    steps:
      - id: check
        shell: bash
        run: |
          EVENT="${{ github.event_name }}"
          FORCE_RUN="${{ github.event.inputs.force_run || 'false' }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$FORCE_RUN" = "true" ]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "slot=manual" >> "$GITHUB_OUTPUT"
              echo "batch_size=${{ github.event.inputs.batch_size || '10' }}" >> "$GITHUB_OUTPUT"
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "slot=manual-disabled" >> "$GITHUB_OUTPUT"
              echo "batch_size=0" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "$EVENT" = "push" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "slot=commit-blog-batch" >> "$GITHUB_OUTPUT"
            echo "batch_size=10" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          US_HOUR=$(TZ=America/New_York date +%H)
          US_DATE=$(TZ=America/New_York date +%F)
          case "$US_HOUR" in
            08|12|16|20)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "slot=$US_DATE-$US_HOUR" >> "$GITHUB_OUTPUT"
              echo "batch_size=1" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "slot=none" >> "$GITHUB_OUTPUT"
              echo "batch_size=0" >> "$GITHUB_OUTPUT"
              ;;
          esac

  generate-and-publish:
    needs: us-schedule-check
    if: needs.us-schedule-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --prefer-online --no-audit --no-fund
      - name: Generate requested blog batch (Claude -> DeepSeek -> Gemini)
        run: npm run generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL || 'claude-sonnet-5' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          BLOG_BATCH_SIZE: ${{ needs.us-schedule-check.outputs.batch_size }}
      - name: Replace all post images with unique topic-matched Pixabay images
        run: node scripts/refresh-images-v2.js
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      - name: Run US SEO audit (images required)
        run: node scripts/seo-audit.js
        env:
          REQUIRE_IMAGES: 'true'
      - name: Publish generated posts and downloaded images
        run: |
          git config user.name "mrglowra-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/ public/images/
          generated=$(git diff --cached --name-only -- posts/ | grep -c '\.json$' || true)
          echo "Post files changed: $generated"
          if [ "$generated" -lt "${{ needs.us-schedule-check.outputs.batch_size }}" ]; then
            echo "ERROR: Expected at least ${{ needs.us-schedule-check.outputs.batch_size }} changed post files but found $generated"
            exit 1
          fi
          git commit -m "Publish US SEO blogs with Pixabay image replacements"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Confirm publishing completed
        run: echo "Published requested US SEO batch with topic-matched Pixabay image replacements."
