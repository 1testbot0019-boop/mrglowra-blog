services:
  - type: web
    name: mrglowra-blog
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node -r ./scripts/ui-theme.js server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SITE_URL
        value: https://blog.mrglowra.com
